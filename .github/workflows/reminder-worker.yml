name: 24/7 Autonomous Task Reminder Worker

on:
  schedule:
    # Runs automatically every 30 minutes in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web page

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Execute Autonomous Reminder Worker
        run: npx tsx scripts/check-reminders.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
